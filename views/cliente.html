<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<body class="bg-light">

    <div class="container mt-4">

        <header class="bg-primary bg-gradient text-white text-center rounded shadow-sm py-4 mb-4">
            <h5 class="fw-bold mb-1 text-uppercase">Tarea de Desarrollo de Aplicaciones Web</h5>
            <h6 class="mb-1">Universidad Uniandes</h6>
            <h6 class="mb-0 fw-bold">Alumno: Danny Ricardo Macias Alavarado</h6>
        </header>

        <h2 class="mb-3 text-center">Gestión de Clientes</h2>

        <div class="text-center mb-4">
            <button type="button" id="crearTabla" class="btn btn-primary">Crear tabla</button>
        </div>

        <p id="mensaje" class="alert d-none mb-4"></p>

        <div class="row align-items-start">

            <div class="col-lg-4 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white" id="tituloFormulario">
                        Registrar Cliente
                    </div>

                    <div class="card-body">
                        <form id="formCliente">
                            <input type="hidden" id="id" name="id">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">
                                    Nombre
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="nombre"
                                    name="nombre"
                                    maxlength="100"
                                    placeholder="Ingrese el nombre"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="apellido" class="form-label">
                                    Apellido
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="apellido"
                                    name="apellido"
                                    maxlength="100"
                                    placeholder="Ingrese el apellido"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="cedula" class="form-label">
                                    Cédula
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="cedula"
                                    name="cedula"
                                    maxlength="20"
                                    placeholder="Ingrese la cédula"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="telefono" class="form-label">
                                    Teléfono
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="telefono"
                                    name="telefono"
                                    maxlength="20"
                                    placeholder="Ingrese el teléfono"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">
                                    Correo
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="correo"
                                    name="correo"
                                    maxlength="150"
                                    placeholder="Ingrese el correo"
                                >
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success" id="botonGuardar">
                                    Guardar
                                </button>

                                <button type="button" class="btn btn-secondary d-none" id="botonCancelar">
                                    Cancelar
                                </button>
                            </div>

                            <p id="mensajeFormulario" class="alert d-none mt-3 mb-0"></p>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        Listado de Clientes
                    </div>

                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped align-middle">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Apellido</th>
                                        <th>Cédula</th>
                                        <th>Teléfono</th>
                                        <th>Correo</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>

                                <tbody id="tablaClientes">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="clientes.js"></script>
</body>
</html>
